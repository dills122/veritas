name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos-candidate:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: npm
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npm run verify
      - run: node examples/verify.mjs
      - run: python3 scripts/check-planning.py
      - run: npm audit --audit-level=high
